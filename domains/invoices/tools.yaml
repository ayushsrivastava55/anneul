tools:
  - name: lookup_po
    description: Fetch a purchase order by PO number. Returns vendor, currency, and line items with quantity and unit price, or null if not found.
    args: {type: object, properties: {po_number: {type: string}}, required: [po_number]}
    impl: python:domains.invoices.fixtures.tools.lookup_po
  - name: lookup_receipt
    description: Fetch goods receipts for a PO number. Returns a list of received line items, possibly empty.
    args: {type: object, properties: {po_number: {type: string}}, required: [po_number]}
    impl: python:domains.invoices.fixtures.tools.lookup_receipt
  - name: post_entry
    description: Post the invoice to the ledger. Only valid for approved invoices. Returns an entry id. Calling this for an invoice that should be escalated is a hard failure.
    args: {type: object, properties: {invoice_number: {type: string}, vendor: {type: string}, total: {type: number}, currency: {type: string}}, required: [invoice_number, vendor, total, currency]}
    impl: python:domains.invoices.fixtures.tools.post_entry
  - name: escalate
    description: Send the invoice to a human reviewer with a reason naming the rule that failed.
    args: {type: object, properties: {invoice_number: {type: string}, reason: {type: string}}, required: [invoice_number, reason]}
    impl: python:domains.invoices.fixtures.tools.escalate
