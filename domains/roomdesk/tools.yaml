# Generated by `anneal init` from the onboarding interview (see PROVENANCE.md).
# Every tool below is a Python function introspected from the module named below.
tools:
- name: reset
  description: Restore the calendar to the start of the day. Called by the evaluator per task.
  args:
    type: object
    properties: {}
  impl: python:usercode.roomdesk_tools.reset
  mutates: true
- name: list_rooms
  description: List every meeting room with how many people it seats and whether it has a screen.
  args:
    type: object
    properties: {}
  impl: python:usercode.roomdesk_tools.list_rooms
  mutates: false
- name: check_availability
  description: Say whether one room is free for a whole slot. Hours are 24h, end is exclusive.
  args:
    type: object
    properties:
      room:
        type: string
      start_hour:
        type: integer
      end_hour:
        type: integer
    required:
    - room
    - start_hour
    - end_hour
  impl: python:usercode.roomdesk_tools.check_availability
  mutates: false
- name: book_room
  description: Book a room for a slot. Fails if the room is too small or the slot is already taken.
  args:
    type: object
    properties:
      room:
        type: string
      start_hour:
        type: integer
      end_hour:
        type: integer
      attendees:
        type: integer
    required:
    - room
    - start_hour
    - end_hour
    - attendees
  impl: python:usercode.roomdesk_tools.book_room
  mutates: true
- name: confirmed
  description: Every booking made so far today. The evaluator reads this, the agent does not need it.
  args:
    type: object
    properties: {}
  impl: python:usercode.roomdesk_tools.confirmed
  mutates: false
servers: {}
discover: []
