    - payment_id
  impl: python:domains.airline.fixtures.tools.update_reservation_flights
  mutates: true
- name: update_reservation_passengers
  description: Update the passenger information of a reservation.
  args:
    type: object
    properties:
      reservation_id:
        type: string
        description: The reservation ID, such as 'ZFA04Y'.
      passengers:
        type: array
        description: An array of objects containing details about each passenger.
        items:
          type: object
          properties:
            first_name:
              type: string
              description: The first name of the passenger, such as 'Noah'.
            last_name:
              type: string
              description: The last name of the passenger, such as 'Brown'.
            dob:
              type: string
              description: The date of birth of the passenger in the format 'YYYY-MM-DD', such as '1990-01-01'.
          required:
          - first_name
          - last_name
          - dob
    required:
    - reservation_id
    - passengers
  impl: python:domains.airline.fixtures.tools.update_reservation_passengers
  mutates: true
