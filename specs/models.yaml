# Model tiers used by Architect (initial assignment) and Anneal (downshift order).
# Keep this the ONLY place model names live.
#
# An all-local Ollama ladder (qwen2.5 3b/1.5b/0.5b, provider `ollama` below) also works if
# no keys are available - see git history (fork lineage) for that exact config with price
# provenance. This file ships the live five-tier ladder because every provider in it was
# exercised end to end during the hackathon.
#
# All three tiers are Anthropic, reached through its OpenAI-SDK compatibility layer
# (FRONTIER_BASE_URL=https://api.anthropic.com/v1/), so anneal/llm.py needs no code change.
#
# Prices are USD per 1M tokens, base input / output, from platform.claude.com/docs pricing
# checked 6 Sep 2026. Note Sonnet 5 moved from $2/$10 to $3/$15 on 1 Sep 2026; the current
# rate is used here. These numbers are what the reported $/task column is computed from, so
# re-check them if the run happens after a price change.
tiers:
  # price_source is what `anneal report` prints per tier; the prose above is the evidence.
  frontier:
    provider: frontier
    model: claude-opus-5
    price_in: 5.0
    price_out: 25.0
    price_source: published        # platform.claude.com/docs pricing, checked 6 Sep 2026
  mid:
    provider: frontier
    model: claude-sonnet-5
    price_in: 3.0
    price_out: 15.0
    price_source: published        # same source; the post-1 Sep 2026 rate
  cheap:
    provider: frontier
    model: claude-haiku-4-5-20251001
    price_in: 1.0
    price_out: 5.0
    price_source: published        # same source
  # --- sponsor-backed floor of the ladder -------------------------------------------------
  # Architect never assigns these (architect.NODE_TIER only names frontier/mid/cheap); the
  # downshift walks into them. Both are reasoning models that return content=None on a
  # tool-call turn, which is fine: llm.complete drops None via model_dump(exclude_none=True)
  # and we never set max_tokens, so reasoning cannot starve the visible answer.
  #
  # glm-4-7-flash is FREE on our TensorMux hackathon allocation (50M tokens). Pricing it at
  # $0 would make it trivially dominate every Pareto front, so we price it at the third-party
  # market rate for the same weights ($0.06/$0.40, Venice/OpenRouter/Cloudflare all agree,
  # checked 6 Sep 2026). Reported $/task is therefore what this config WOULD cost anyone, not
  # what we were charged. Said plainly in the README.
  flash:
    provider: tensormux
    model: glm-4-7-flash
    price_in: 0.06
    price_out: 0.40
    price_source: published        # third-party market rate for these weights (see above);
                                   # NOT what we were charged, which was $0 on the allocation
  # gpt-5-nano via the AI Grants India key. Official OpenAI list price, checked 6 Sep 2026.
  nano:
    provider: aigi
    model: gpt-5-nano
    price_in: 0.05
    price_out: 0.40
    price_source: published        # OpenAI list price, checked 6 Sep 2026
downshift_order: [frontier, mid, cheap, flash, nano]
providers:
  ollama:    {base_url_env: OLLAMA_BASE_URL,    api_key_env: OLLAMA_API_KEY}
  tensormux: {base_url_env: TENSORMUX_BASE_URL, api_key_env: TENSORMUX_API_KEY}
  frontier:  {base_url_env: FRONTIER_BASE_URL,  api_key_env: FRONTIER_API_KEY}
  aigi:      {base_url_env: AIGI_BASE_URL,      api_key_env: AIGI_API_KEY}
