# Example harness spec produced by Architect and mutated by operators.
# Everything the runtime needs to execute a candidate is here; nothing domain-specific.
id: cand-02
topology: planner_executor      # single | planner_executor | critic_loop | tool_router
step_budget: 12                 # total LLM steps across nodes per task
memory:
  enabled: false                # episodic memory of prior escalations / outcomes
  kind: none                    # none | episodic
  top_k: 3
nodes:
  - name: planner
    role: planner
    model_tier: frontier        # frontier | mid | cheap  (resolved via specs/models.yaml)
    system_prompt_ref: anneal/invoices/planner@v1   # Neatlogs prompt name@version
    tools: []                   # planner sees no tools
    max_steps: 2
  - name: executor
    role: executor
    model_tier: mid
    system_prompt_ref: anneal/invoices/executor@v1
    tools: [lookup_po, lookup_receipt, post_entry, escalate]
    max_steps: 8
  - name: validator
    role: validator
    model_tier: cheap
    system_prompt_ref: anneal/invoices/validator@v1
    tools: []
    max_steps: 1
    schema_ref: output_schema   # validates final JSON against eval's expected shape
lineage:
  parent: cand-02
  iteration: 3
  operator: add_validator_node
  ledger_issue: L-0007
