[project]
name = "anneal"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "neatlogs",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["domains/*/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
