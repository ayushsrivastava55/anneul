[project]
name = "anneal"
version = "0.1.0"
description = "Automated agent engineering: generate, diagnose, mutate, gate and anneal harnesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai",
  "pydantic",
  "pyyaml",
  "neatlogs",
  "httpx",
  "rich",
  "scipy",
  "python-dotenv",
  "fastapi",
  "uvicorn",
  "dodopayments",
]

[project.scripts]
anneal = "anneal.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anneal"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["domains/*/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
