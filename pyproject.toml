[project]
name = "anneal"
version = "0.0.0"
description = "Anneal: self-improving agent harness (minimal pyproject for the llm-gateway worker; scaffold owns the real one)"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["domains/*/fixtures"]
