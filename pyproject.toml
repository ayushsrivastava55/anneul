[project]
name = "anneal"
version = "0.1.0"
description = "Automated agent engineering: generate, diagnose, mutate, gate and anneal harnesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai",
  "pydantic",
  "pyyaml",
  "neatlogs",
  "httpx",
  "rich",
  "scipy",
  "python-dotenv",
  "fastapi",
  "uvicorn",
  "dodopayments",
  "python-multipart>=0.0.32",
]

[project.scripts]
anneal = "anneal.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anneal"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["domains/*/fixtures", "runs-archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# eval.py may be loaded by file path by the runtime, so it puts the repo root on sys.path
# before importing its own fixtures. That guard has to precede the imports.
"domains/*/eval.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# The default suite is offline (see tests/conftest.py). `live` marks the tests that really
# call a provider: they were self-skipping on a missing key, which quietly turned into a
# hard failure the moment real keys landed and the network was restricted. Opt in with
# `pytest -m live` when you actually want to check the gateway.
markers = ["live: calls a real provider over the network; excluded by default"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
