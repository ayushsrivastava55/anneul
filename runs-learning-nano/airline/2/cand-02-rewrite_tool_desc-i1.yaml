tool_overrides:
  calculate: "Computes the result of a pure mathematical expression (e.g., summing\
    \ prices, multiplying fees, computing differences) from numbers you already fetched\
    \ via tools. It does not fetch, verify, or validate any data itself.\n\nUse when:\
    \ you need an arithmetic result (totals, refund amounts, fee differences) built\
    \ from values already retrieved from the user/reservation/flight lookups, purely\
    \ to report an answer or to determine an amount for a write call whose eligibility\
    \ you have already confirmed via policy and tool data.\n\nDo not use when: you\
    \ are trying to decide whether an action is policy-compliant (e.g., whether a\
    \ cancellation, refund, or exception is allowed) \u2014 policy eligibility must\
    \ be checked against the actual reservation/user data returned by lookup tools,\
    \ not inferred or computed; also do not use it as a substitute for looking up\
    \ missing data (e.g., insurance status, fare class, cabin) or as a basis for deciding\
    \ to escalate to a human \u2014 escalation and policy decisions must come from\
    \ tool-verified facts, not from calculator output."
